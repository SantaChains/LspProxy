name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath \
            -ldflags="-s -w \
              -X main.version=${{ github.ref_name }} \
              -X main.commit=$(git rev-parse --short HEAD) \
              -X main.date=$(date -u +%Y-%m-%d)" \
            -o "LspProxy-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: LspProxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: LspProxy-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git tag -l --format='%(contents)' ${GITHUB_REF_NAME} > tag.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum LspProxy-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: tag.md
          files: |
            artifacts/LspProxy-*
            artifacts/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
